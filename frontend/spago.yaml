package:
  name: calypso-frontend
  description: Halogen frontend — composition module, live cells, hylograph pane.
  bundle:
    module: Calypso.Frontend.Main
    outfile: public/bundle.js
    platform: browser
  dependencies:
    - aff
    - affjax
    - affjax-web
    - argonaut-codecs
    - argonaut-core
    - arrays
    - codec
    - codec-argonaut
    - console
    - effect
    - either
    - foldable-traversable
    - foreign
    - halogen
    - http-methods
    - integers
    - maybe
    - nullable
    - numbers
    - ordered-collections
    - calypso-shared
    - prelude
    - random
    - strings
    - transformers
    - tuples
    - web-dom
    - web-events
    - web-html
    - web-uievents
